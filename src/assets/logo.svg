<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 320" width="100%" height="100%">
  <!-- Fondo del logotipo -->
  <rect width="500" height="320" fill="#195058"/>

  <!-- Emblema Principal (Cruz y Letra D estilizada) -->
  <g transform="translate(150, 20)">
    <!-- Cruz blanca de fondo -->
    <path d="M 50 70 H 90 V 110 H 130 V 70 H 170 V 110 H 210 V 150 H 170 V 190 H 130 V 150 H 90 V 190 H 50 V 150 H 10 V 110 H 50 Z" fill="#ffffff" />
    <!-- Círculo superior -->
    <circle cx="110" cy="50" r="22" fill="#ffffff" />
    <!-- Cuerpo exterior de la letra D -->
    <path d="M 130 20 H 185 C 225 20, 255 50, 255 110 C 255 170, 225 200, 185 200 H 130 Z" fill="#ffffff" />
    <!-- Recorte interior para formar el contorno de la D -->
    <path d="M 130 45 H 180 C 205 45, 230 65, 230 110 C 230 155, 205 175, 180 175 H 130 Z" fill="#195058" />
    <!-- Ajuste para aislar la cruz dentro de la D -->
    <rect x="110" y="80" width="75" height="60" fill="#195058" />
  </g>

  <!-- Sello de Acreditación (Derecha Superior) -->
  <g transform="translate(365, 30)">
    <circle cx="40" cy="40" r="38" fill="none" stroke="#ffffff" stroke-width="2"/>
    <text x="40" y="18" fill="#ffffff" font-size="6.5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">ACREDITADO</text>
    <!-- Estrella del sello -->
    <polygon points="40,25 42.5,33 51,33 44,38 46.5,46 40,41 33.5,46 36,38 29,33 37.5,33" fill="#ffffff"/>
    <text x="40" y="62" fill="#ffffff" font-size="5.5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">COMISIÓN NACIONAL</text>
    <text x="40" y="69" fill="#ffffff" font-size="5.5" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">DE ACREDITACIÓN</text>
  </g>

  <!-- Textos inferiores -->
  <text x="250" y="235" fill="#ffffff" font-size="17" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">Hospital San Juan de Dios - CDT</text>
  <text x="250" y="260" fill="#ffffff" font-size="17" font-family="Arial, sans-serif" font-weight="bold" text-anchor="middle">Asistencial Docente</text>
  <text x="250" y="288" fill="#ffffff" font-style="italic" font-size="14" font-family="Arial, sans-serif" text-anchor="middle">"El Primero de Chile"</text>
</svg>
